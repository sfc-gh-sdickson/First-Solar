<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 500">
  <!-- First Solar - Deployment Flow Diagram -->
  <defs>
    <style>
      text { font-family: Arial, sans-serif; }
      .title { font-size: 18px; font-weight: bold; fill: #1a1a1a; }
      .step-num { font-size: 14px; font-weight: bold; fill: #fff; }
      .step-label { font-size: 10px; font-weight: bold; fill: #fff; }
      .step-detail { font-size: 8px; fill: #fff; opacity: 0.9; }
      .arrow { fill: none; stroke: #666; stroke-width: 1.5; marker-end: url(#arrowhead2); }
      .section-title { font-size: 11px; font-weight: bold; fill: #555; }
    </style>
    <marker id="arrowhead2" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#666"/>
    </marker>
  </defs>

  <rect width="1100" height="500" fill="#fafafa" rx="8"/>
  <text x="550" y="30" text-anchor="middle" class="title">Deployment Flow — Execution Order</text>

  <!-- Row 1: Setup (blue) -->
  <text x="30" y="65" class="section-title">SETUP</text>
  <rect x="30" y="75" width="155" height="70" rx="6" fill="#1565C0"/>
  <text x="107" y="95" text-anchor="middle" class="step-num">01</text>
  <text x="107" y="112" text-anchor="middle" class="step-label">Database &amp; Schema</text>
  <text x="107" y="126" text-anchor="middle" class="step-detail">FS_INTELLIGENCE</text>
  <text x="107" y="137" text-anchor="middle" class="step-detail">RAW / ANALYTICS / REFERENCE</text>

  <line x1="185" y1="110" x2="210" y2="110" class="arrow"/>

  <rect x="210" y="75" width="155" height="70" rx="6" fill="#1565C0"/>
  <text x="287" y="95" text-anchor="middle" class="step-num">02</text>
  <text x="287" y="112" text-anchor="middle" class="step-label">Create Tables</text>
  <text x="287" y="126" text-anchor="middle" class="step-detail">17 RAW + 5 REFERENCE</text>
  <text x="287" y="137" text-anchor="middle" class="step-detail">22 tables total</text>

  <line x1="365" y1="110" x2="390" y2="110" class="arrow"/>

  <!-- Row 1 continued: Data (green) -->
  <text x="390" y="65" class="section-title">DATA</text>
  <rect x="390" y="75" width="155" height="70" rx="6" fill="#2E7D32"/>
  <text x="467" y="95" text-anchor="middle" class="step-num">03</text>
  <text x="467" y="112" text-anchor="middle" class="step-label">Load Synthetic Data</text>
  <text x="467" y="126" text-anchor="middle" class="step-detail">CSV → Stage → COPY INTO</text>
  <text x="467" y="137" text-anchor="middle" class="step-detail">~10,000 rows operational</text>

  <line x1="545" y1="110" x2="570" y2="110" class="arrow"/>

  <rect x="570" y="75" width="155" height="70" rx="6" fill="#2E7D32"/>
  <text x="647" y="95" text-anchor="middle" class="step-num">03b</text>
  <text x="647" y="112" text-anchor="middle" class="step-label">Supply Chain Intel</text>
  <text x="647" y="126" text-anchor="middle" class="step-detail">Risk profiles, trade lanes</text>
  <text x="647" y="137" text-anchor="middle" class="step-detail">Benchmarks, events, lot trace</text>

  <!-- L-shaped connector to row 2 -->
  <line x1="647" y1="145" x2="647" y2="170" stroke="#666" stroke-width="1.5"/>
  <line x1="647" y1="170" x2="107" y2="170" stroke="#666" stroke-width="1.5"/>
  <line x1="107" y1="170" x2="107" y2="195" class="arrow"/>

  <!-- Row 2: Views & Search (purple) -->
  <text x="30" y="195" class="section-title">VIEWS &amp; SEARCH</text>
  <rect x="30" y="205" width="155" height="70" rx="6" fill="#6A1B9A"/>
  <text x="107" y="225" text-anchor="middle" class="step-num">04</text>
  <text x="107" y="242" text-anchor="middle" class="step-label">Analytical Views</text>
  <text x="107" y="256" text-anchor="middle" class="step-detail">7 views in ANALYTICS</text>
  <text x="107" y="267" text-anchor="middle" class="step-detail">Enriched joins + calculations</text>

  <line x1="185" y1="240" x2="210" y2="240" class="arrow"/>

  <rect x="210" y="205" width="155" height="70" rx="6" fill="#6A1B9A"/>
  <text x="287" y="225" text-anchor="middle" class="step-num">05</text>
  <text x="287" y="242" text-anchor="middle" class="step-label">3 Semantic Views</text>
  <text x="287" y="256" text-anchor="middle" class="step-detail">Operations / Manufacturing</text>
  <text x="287" y="267" text-anchor="middle" class="step-detail">Risk Intelligence</text>

  <line x1="365" y1="240" x2="390" y2="240" class="arrow"/>

  <rect x="390" y="205" width="155" height="70" rx="6" fill="#6A1B9A"/>
  <text x="467" y="225" text-anchor="middle" class="step-num">06</text>
  <text x="467" y="242" text-anchor="middle" class="step-label">3 Cortex Search</text>
  <text x="467" y="256" text-anchor="middle" class="step-detail">Operational Notes</text>
  <text x="467" y="267" text-anchor="middle" class="step-detail">Supplier Events / Risk Intel</text>

  <!-- L-shaped connector to row 3 -->
  <line x1="467" y1="275" x2="467" y2="300" stroke="#666" stroke-width="1.5"/>
  <line x1="467" y1="300" x2="107" y2="300" stroke="#666" stroke-width="1.5"/>
  <line x1="107" y1="300" x2="107" y2="325" class="arrow"/>

  <!-- Row 3: ML & Agent (orange) -->
  <text x="30" y="325" class="section-title">ML &amp; AGENT</text>
  <rect x="30" y="335" width="155" height="70" rx="6" fill="#E65100"/>
  <text x="107" y="355" text-anchor="middle" class="step-num">07</text>
  <text x="107" y="372" text-anchor="middle" class="step-label">ML Models (Notebook)</text>
  <text x="107" y="386" text-anchor="middle" class="step-detail">GBR Demand Forecast</text>
  <text x="107" y="397" text-anchor="middle" class="step-detail">GBC Stockout Risk → Registry</text>

  <line x1="185" y1="370" x2="210" y2="370" class="arrow"/>

  <rect x="210" y="335" width="155" height="70" rx="6" fill="#E65100"/>
  <text x="287" y="355" text-anchor="middle" class="step-num">08</text>
  <text x="287" y="372" text-anchor="middle" class="step-label">ML Model Functions</text>
  <text x="287" y="386" text-anchor="middle" class="step-detail">4 UDFs calling</text>
  <text x="287" y="397" text-anchor="middle" class="step-detail">MODEL()!PREDICT()</text>

  <line x1="365" y1="370" x2="390" y2="370" class="arrow"/>

  <rect x="390" y="335" width="155" height="70" rx="6" fill="#D32F2F"/>
  <text x="467" y="355" text-anchor="middle" class="step-num">09</text>
  <text x="467" y="372" text-anchor="middle" class="step-label">CREATE AGENT</text>
  <text x="467" y="386" text-anchor="middle" class="step-detail">YAML spec, 10 tools</text>
  <text x="467" y="397" text-anchor="middle" class="step-detail">sample_questions, PROFILE</text>

  <!-- Final arrow to deployed -->
  <line x1="545" y1="370" x2="590" y2="370" class="arrow"/>
  <rect x="590" y="345" width="160" height="50" rx="25" fill="#29B5E8"/>
  <text x="670" y="367" text-anchor="middle" class="step-label" style="font-size:12px">DEPLOYED</text>
  <text x="670" y="383" text-anchor="middle" class="step-detail" style="font-size:9px">FIRST_SOLAR_AGENT</text>

  <!-- Legend -->
  <rect x="30" y="440" width="12" height="12" rx="2" fill="#1565C0"/>
  <text x="48" y="450" style="font-size:9px; fill:#333;">Setup</text>
  <rect x="100" y="440" width="12" height="12" rx="2" fill="#2E7D32"/>
  <text x="118" y="450" style="font-size:9px; fill:#333;">Data</text>
  <rect x="160" y="440" width="12" height="12" rx="2" fill="#6A1B9A"/>
  <text x="178" y="450" style="font-size:9px; fill:#333;">Views &amp; Search</text>
  <rect x="265" y="440" width="12" height="12" rx="2" fill="#E65100"/>
  <text x="283" y="450" style="font-size:9px; fill:#333;">ML &amp; Agent</text>

  <text x="550" y="485" text-anchor="middle" style="font-size:9px; fill:#999;">Execute files in strict sequential order (01 → 09). Each step depends on the previous.</text>
</svg>
