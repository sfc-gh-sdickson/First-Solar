<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 520">
  <defs>
    <style>
      text { font-family: Arial, sans-serif; }
      .title { font-size: 18px; font-weight: bold; fill: #1a1a1a; }
      .step-num { font-size: 13px; font-weight: bold; fill: #fff; }
      .step-label { font-size: 10px; font-weight: bold; fill: #fff; }
      .step-detail { font-size: 8.5px; fill: #fff; opacity: 0.9; }
      .connector { fill: none; stroke: #888; stroke-width: 1.5; }
      .section-title { font-size: 11px; font-weight: bold; fill: #555; text-transform: uppercase; letter-spacing: 1px; }
    </style>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="112%">
      <feDropShadow dx="2" dy="3" stdDeviation="2.5" flood-opacity="0.2"/>
    </filter>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#888"/>
    </marker>
  </defs>

  <rect width="1100" height="520" fill="#f8f9fa" rx="8"/>
  <text x="550" y="32" text-anchor="middle" class="title">Deployment Flow — Execution Order</text>

  <!-- ═══ ROW 1: SETUP + DATA ═══ -->
  <text x="45" y="62" class="section-title">Setup</text>

  <rect x="35" y="72" width="160" height="65" rx="7" fill="#1565C0" filter="url(#shadow)"/>
  <text x="115" y="92" text-anchor="middle" class="step-num">01</text>
  <text x="115" y="108" text-anchor="middle" class="step-label">Database &amp; Schema</text>
  <text x="115" y="122" text-anchor="middle" class="step-detail">FS_INTELLIGENCE</text>
  <text x="115" y="132" text-anchor="middle" class="step-detail">RAW / ANALYTICS / REFERENCE</text>

  <!-- Arrow: right-center of 01 → left-center of 02 -->
  <line x1="195" y1="104" x2="218" y2="104" class="connector" marker-end="url(#arrow)"/>

  <rect x="220" y="72" width="160" height="65" rx="7" fill="#1565C0" filter="url(#shadow)"/>
  <text x="300" y="92" text-anchor="middle" class="step-num">02</text>
  <text x="300" y="108" text-anchor="middle" class="step-label">Create Tables</text>
  <text x="300" y="122" text-anchor="middle" class="step-detail">17 RAW + 5 REFERENCE</text>
  <text x="300" y="132" text-anchor="middle" class="step-detail">22 tables total</text>

  <!-- Arrow: right-center of 02 → left-center of 03 -->
  <line x1="380" y1="104" x2="413" y2="104" class="connector" marker-end="url(#arrow)"/>

  <text x="415" y="62" class="section-title">Data</text>

  <rect x="415" y="72" width="160" height="65" rx="7" fill="#2E7D32" filter="url(#shadow)"/>
  <text x="495" y="92" text-anchor="middle" class="step-num">03</text>
  <text x="495" y="108" text-anchor="middle" class="step-label">Load Synthetic Data</text>
  <text x="495" y="122" text-anchor="middle" class="step-detail">CSV → Stage → COPY INTO</text>
  <text x="495" y="132" text-anchor="middle" class="step-detail">~10,400 operational rows</text>

  <!-- Arrow: right-center of 03 → left-center of 03b -->
  <line x1="575" y1="104" x2="598" y2="104" class="connector" marker-end="url(#arrow)"/>

  <rect x="600" y="72" width="175" height="65" rx="7" fill="#2E7D32" filter="url(#shadow)"/>
  <text x="687" y="92" text-anchor="middle" class="step-num">03b</text>
  <text x="687" y="108" text-anchor="middle" class="step-label">Supply Chain Intelligence</text>
  <text x="687" y="122" text-anchor="middle" class="step-detail">Risk profiles, trade lanes</text>
  <text x="687" y="132" text-anchor="middle" class="step-detail">Benchmarks, events, lot trace</text>

  <!-- L-connector: bottom-center of 03b → down → left → down to top-center of 04 -->
  <polyline points="687,137 687,158 115,158 115,178" class="connector" marker-end="url(#arrow)"/>

  <!-- ═══ ROW 2: VIEWS & SEARCH ═══ -->
  <text x="45" y="192" class="section-title">Views &amp; Search</text>

  <rect x="35" y="202" width="160" height="65" rx="7" fill="#6A1B9A" filter="url(#shadow)"/>
  <text x="115" y="222" text-anchor="middle" class="step-num">04</text>
  <text x="115" y="238" text-anchor="middle" class="step-label">Analytical Views</text>
  <text x="115" y="252" text-anchor="middle" class="step-detail">7 enriched views</text>
  <text x="115" y="262" text-anchor="middle" class="step-detail">in ANALYTICS schema</text>

  <line x1="195" y1="234" x2="218" y2="234" class="connector" marker-end="url(#arrow)"/>

  <rect x="220" y="202" width="160" height="65" rx="7" fill="#6A1B9A" filter="url(#shadow)"/>
  <text x="300" y="222" text-anchor="middle" class="step-num">05</text>
  <text x="300" y="238" text-anchor="middle" class="step-label">3 Semantic Views</text>
  <text x="300" y="252" text-anchor="middle" class="step-detail">Operations / Manufacturing</text>
  <text x="300" y="262" text-anchor="middle" class="step-detail">Risk Intelligence</text>

  <line x1="380" y1="234" x2="413" y2="234" class="connector" marker-end="url(#arrow)"/>

  <rect x="415" y="202" width="160" height="65" rx="7" fill="#6A1B9A" filter="url(#shadow)"/>
  <text x="495" y="222" text-anchor="middle" class="step-num">06</text>
  <text x="495" y="238" text-anchor="middle" class="step-label">3 Cortex Search</text>
  <text x="495" y="252" text-anchor="middle" class="step-detail">Operational Notes</text>
  <text x="495" y="262" text-anchor="middle" class="step-detail">Supplier Events / Risk Intel</text>

  <!-- L-connector: bottom-center of 06 → down → left → down to top-center of 07 -->
  <polyline points="495,267 495,288 115,288 115,308" class="connector" marker-end="url(#arrow)"/>

  <!-- ═══ ROW 3: ML & AGENT ═══ -->
  <text x="45" y="322" class="section-title">ML &amp; Agent</text>

  <rect x="35" y="332" width="160" height="65" rx="7" fill="#E65100" filter="url(#shadow)"/>
  <text x="115" y="352" text-anchor="middle" class="step-num">07</text>
  <text x="115" y="368" text-anchor="middle" class="step-label">ML Models (Notebook)</text>
  <text x="115" y="382" text-anchor="middle" class="step-detail">GBR Demand Forecast</text>
  <text x="115" y="392" text-anchor="middle" class="step-detail">GBC Stockout → Registry</text>

  <line x1="195" y1="364" x2="218" y2="364" class="connector" marker-end="url(#arrow)"/>

  <rect x="220" y="332" width="160" height="65" rx="7" fill="#E65100" filter="url(#shadow)"/>
  <text x="300" y="352" text-anchor="middle" class="step-num">08</text>
  <text x="300" y="368" text-anchor="middle" class="step-label">Model Functions</text>
  <text x="300" y="382" text-anchor="middle" class="step-detail">4 UDFs calling</text>
  <text x="300" y="392" text-anchor="middle" class="step-detail">MODEL()!PREDICT()</text>

  <line x1="380" y1="364" x2="413" y2="364" class="connector" marker-end="url(#arrow)"/>

  <rect x="415" y="332" width="160" height="65" rx="7" fill="#C62828" filter="url(#shadow)"/>
  <text x="495" y="352" text-anchor="middle" class="step-num">09</text>
  <text x="495" y="368" text-anchor="middle" class="step-label">CREATE AGENT</text>
  <text x="495" y="382" text-anchor="middle" class="step-detail">YAML spec, 10 tools</text>
  <text x="495" y="392" text-anchor="middle" class="step-detail">15 sample_questions</text>

  <!-- Arrow: right-center of 09 → left-center of DEPLOYED -->
  <line x1="575" y1="364" x2="618" y2="364" class="connector" marker-end="url(#arrow)"/>

  <!-- DEPLOYED pill -->
  <rect x="620" y="342" width="170" height="48" rx="24" fill="#29B5E8" filter="url(#shadow)"/>
  <text x="705" y="363" text-anchor="middle" class="box-label" style="font-size:13px;">DEPLOYED</text>
  <text x="705" y="380" text-anchor="middle" class="box-detail" style="font-size:9px;">FIRST_SOLAR_AGENT</text>

  <!-- ═══ LEGEND ═══ -->
  <rect x="35" y="430" width="14" height="14" rx="3" fill="#1565C0"/>
  <text x="55" y="442" style="font-size:10px; fill:#333;">Setup</text>
  <rect x="115" y="430" width="14" height="14" rx="3" fill="#2E7D32"/>
  <text x="135" y="442" style="font-size:10px; fill:#333;">Data</text>
  <rect x="195" y="430" width="14" height="14" rx="3" fill="#6A1B9A"/>
  <text x="215" y="442" style="font-size:10px; fill:#333;">Views &amp; Search</text>
  <rect x="325" y="430" width="14" height="14" rx="3" fill="#E65100"/>
  <text x="345" y="442" style="font-size:10px; fill:#333;">ML &amp; Agent</text>

  <text x="550" y="500" text-anchor="middle" style="font-size:9px; fill:#aaa;">Execute in strict order (01 → 09). Each step depends on the previous. See docs/AGENT_SETUP.md for details.</text>
</svg>
