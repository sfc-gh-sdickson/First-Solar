  <text x="410" y="553" style="font-size:9px; fill:#333;">PLANTS (3)</text>
  <text x="410" y="567" style="font-size:9px; fill:#333;">MATERIALS (50)</text>
  <text x="410" y="581" style="font-size:9px; fill:#333;">SUPPLIERS (20)</text>
  <text x="410" y="595" style="font-size:9px; fill:#333;">PURCHASE_ORDERS (790)</text>
  <text x="410" y="609" style="font-size:9px; fill:#333;">INVENTORY_SNAPSHOT (2,394)</text>
  <text x="410" y="623" style="font-size:9px; fill:#333;">MRP_DEMAND (3,780)</text>
  <text x="410" y="637" style="font-size:9px; fill:#333;">MANUFACTURING_SCHEDULE (66)</text>
  <text x="410" y="651" style="font-size:9px; fill:#333;">ANOMALY_ALERTS (115)</text>
  <text x="410" y="665" style="font-size:9px; fill:#333;">SUPPLY_RECOMMENDATIONS (58)</text>
  <text x="410" y="679" style="font-size:9px; fill:#333;">INVENTORY_TRANSFERS (64)</text>
