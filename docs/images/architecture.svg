<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800">
  <!-- First Solar Supply Chain Intelligence Agent - System Architecture -->
  <defs>
    <style>
      text { font-family: Arial, sans-serif; }
      .title { font-size: 20px; font-weight: bold; fill: #1a1a1a; }
      .subtitle { font-size: 12px; fill: #666; }
      .box-label { font-size: 11px; font-weight: bold; fill: #fff; }
      .box-detail { font-size: 9px; fill: #fff; }
      .section-label { font-size: 13px; font-weight: bold; fill: #333; }
      .arrow { fill: none; stroke: #666; stroke-width: 1.5; marker-end: url(#arrowhead); }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#666"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1200" height="800" fill="#fafafa" rx="8"/>

  <!-- Title -->
  <text x="600" y="35" text-anchor="middle" class="title">First Solar Supply Chain Intelligence Agent — System Architecture</text>
  <text x="600" y="55" text-anchor="middle" class="subtitle">FS_INTELLIGENCE Database | 3 Schemas | 10 Agent Tools | AWS161</text>

  <!-- User/Client Layer -->
  <rect x="480" y="70" width="240" height="45" rx="6" fill="#1B6B93"/>
  <text x="600" y="92" text-anchor="middle" class="box-label">Supply Chain Planners</text>
  <text x="600" y="106" text-anchor="middle" class="box-detail">Natural Language Questions → Snowflake Intelligence</text>

  <line x1="600" y1="115" x2="600" y2="140" class="arrow"/>

  <!-- Agent Box -->
  <rect x="380" y="140" width="440" height="55" rx="8" fill="#29B5E8"/>
  <text x="600" y="163" text-anchor="middle" class="box-label" style="font-size:14px">FIRST_SOLAR_AGENT</text>
  <text x="600" y="180" text-anchor="middle" class="box-detail" style="font-size:10px">10 Tools: 3 Cortex Analyst + 3 Cortex Search + 4 UDFs | YAML Spec</text>

  <!-- Tool Layer - 3 columns -->
  <!-- Column 1: Cortex Analyst -->
  <line x1="460" y1="195" x2="200" y2="230" class="arrow"/>
  <line x1="600" y1="195" x2="600" y2="230" class="arrow"/>
  <line x1="740" y1="195" x2="1000" y2="230" class="arrow"/>

  <!-- Cortex Analyst Tools -->
  <text x="200" y="225" text-anchor="middle" class="section-label">Cortex Analyst (3)</text>
  <rect x="50" y="240" width="300" height="40" rx="5" fill="#2196F3"/>
  <text x="200" y="258" text-anchor="middle" class="box-label">SupplyChainOps</text>
  <text x="200" y="272" text-anchor="middle" class="box-detail">Inventory, POs, Suppliers, Transfers, Recommendations</text>

  <rect x="50" y="290" width="300" height="40" rx="5" fill="#2196F3"/>
  <text x="200" y="308" text-anchor="middle" class="box-label">ManufacturingDemand</text>
  <text x="200" y="322" text-anchor="middle" class="box-detail">Schedule, Forecasts, BOM, Customers, MRP</text>

  <rect x="50" y="340" width="300" height="40" rx="5" fill="#2196F3"/>
  <text x="200" y="358" text-anchor="middle" class="box-label">RiskIntelligence</text>
  <text x="200" y="372" text-anchor="middle" class="box-detail">Risk Profiles, Trade Lanes, Benchmarks, Anomalies</text>

  <!-- Cortex Search Tools -->
  <text x="600" y="225" text-anchor="middle" class="section-label">Cortex Search (3)</text>
  <rect x="450" y="240" width="300" height="40" rx="5" fill="#4CAF50"/>
  <text x="600" y="258" text-anchor="middle" class="box-label">OperationalNotesSearch</text>
  <text x="600" y="272" text-anchor="middle" class="box-detail">Recommendation Reasons, Alert Descriptions, Schedule Changes</text>

  <rect x="450" y="290" width="300" height="40" rx="5" fill="#4CAF50"/>
  <text x="600" y="308" text-anchor="middle" class="box-label">SupplierEventsSearch</text>
  <text x="600" y="322" text-anchor="middle" class="box-detail">Force Majeure, Port Delays, Quality Holds, Capacity Changes</text>

  <rect x="450" y="340" width="300" height="40" rx="5" fill="#4CAF50"/>
  <text x="600" y="358" text-anchor="middle" class="box-label">RiskSearch</text>
  <text x="600" y="372" text-anchor="middle" class="box-detail">Material Risk Notes, Trade Lane Logistics Notes</text>

