  <text x="1000" y="225" text-anchor="middle" class="section-label">UDF Functions (4)</text>
  <rect x="850" y="240" width="300" height="40" rx="5" fill="#FF9800"/>
  <text x="1000" y="258" text-anchor="middle" class="box-label">StockoutRiskPredictor</text>
  <text x="1000" y="272" text-anchor="middle" class="box-detail">MODEL()!PREDICT() → Top 25 at-risk materials</text>

  <rect x="850" y="290" width="300" height="40" rx="5" fill="#FF9800"/>
  <text x="1000" y="308" text-anchor="middle" class="box-label">DemandForecast</text>
  <text x="1000" y="322" text-anchor="middle" class="box-detail">8-week forecast by plant × product with CI</text>

  <rect x="850" y="340" width="300" height="40" rx="5" fill="#FF9800"/>
  <text x="1000" y="358" text-anchor="middle" class="box-label">MaterialRiskSummary</text>
  <text x="1000" y="372" text-anchor="middle" class="box-detail">Single-source and critical material profiles</text>

  <rect x="850" y="390" width="300" height="40" rx="5" fill="#FF9800"/>
  <text x="1000" y="408" text-anchor="middle" class="box-label">SupplyChainKPIs</text>
  <text x="1000" y="422" text-anchor="middle" class="box-detail">Executive dashboard: value, DFC, POs, alerts, adherence</text>

