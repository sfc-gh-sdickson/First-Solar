  <line x1="600" y1="419" x2="720" y2="512" class="connector" marker-end="url(#arrow)"/>

  <!-- Arrow: UDFs → ANALYTICS (bottom of UDF col to top of ANALYTICS box) -->
  <line x1="1000" y1="477" x2="940" y2="512" class="connector" marker-end="url(#arrow)"/>

  <!-- ═══ DATA SOURCE ═══ -->
  <rect x="400" y="740" width="240" height="45" rx="6" fill="#37474F" filter="url(#shadow)"/>
  <text x="520" y="760" text-anchor="middle" class="box-label">generate_data.py</text>
  <text x="520" y="776" text-anchor="middle" class="box-detail">Python → CSV → Stage → COPY INTO</text>

  <rect x="660" y="740" width="240" height="45" rx="6" fill="#37474F" filter="url(#shadow)"/>
  <text x="780" y="760" text-anchor="middle" class="box-label">ML Pipeline (Notebook)</text>
  <text x="780" y="776" text-anchor="middle" class="box-detail">GBR + GBC → Model Registry</text>

  <!-- Arrows up to data layer (top-center of source to bottom-center of data) -->
  <line x1="520" y1="740" x2="500" y2="713" class="connector" marker-end="url(#arrow)"/>
  <line x1="780" y1="740" x2="940" y2="713" class="connector" marker-end="url(#arrow)"/>

  <!-- ═══ LEGEND ═══ -->
  <rect x="50" y="800" width="14" height="14" rx="3" fill="#1976D2" filter="url(#shadow)"/>
  <text x="70" y="812" style="font-size:10px; fill:#333;">Cortex Analyst</text>
  <rect x="175" y="800" width="14" height="14" rx="3" fill="#388E3C" filter="url(#shadow)"/>
  <text x="195" y="812" style="font-size:10px; fill:#333;">Cortex Search</text>
  <rect x="300" y="800" width="14" height="14" rx="3" fill="#E65100" filter="url(#shadow)"/>
  <text x="320" y="812" style="font-size:10px; fill:#333;">UDF Functions</text>
  <rect x="420" y="800" width="14" height="14" rx="3" fill="#6A1B9A" filter="url(#shadow)"/>
  <text x="440" y="812" style="font-size:10px; fill:#333;">Semantic Views</text>
  <rect x="545" y="800" width="14" height="14" rx="3" fill="#29B5E8" filter="url(#shadow)"/>
  <text x="565" y="812" style="font-size:10px; fill:#333;">Agent</text>

  <text x="600" y="843" text-anchor="middle" style="font-size:9px; fill:#aaa;">First Solar Supply Chain Intelligence Agent | Warehouse: FIRST_SOLAR_WH</text>
