  <text x="630" y="556" style="font-size:9px; fill:#333;">MATERIAL_RISK_PROFILE (50)</text>
  <text x="630" y="573" style="font-size:9px; fill:#333;">TRADE_LANE_DIM (54)</text>
  <text x="630" y="590" style="font-size:9px; fill:#333;">INDUSTRY_BENCHMARK_DIM (38)</text>
  <text x="630" y="607" style="font-size:9px; fill:#333;">SUPPLIER_EVENT_LOG (20)</text>
