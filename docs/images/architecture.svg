  <text x="850" y="573" style="font-size:9px; fill:#333;">3 Cortex Search Services</text>
  <text x="850" y="590" style="font-size:9px; fill:#333;">4 UDF Functions</text>
  <text x="850" y="607" style="font-size:9px; fill:#333;">7 Analytical Views</text>
  <text x="850" y="624" style="font-size:9px; fill:#333;">1 Agent</text>
  <text x="850" y="645" style="font-size:9px; fill:#333;">ML Models (Registry):</text>
  <text x="850" y="662" style="font-size:9px; fill:#333;">  DEMAND_FORECAST_MODEL V1</text>
  <text x="850" y="679" style="font-size:9px; fill:#333;">  STOCKOUT_RISK_MODEL V1</text>

  <!-- Arrows: Semantic Views → RAW data (right-center to left-center) -->
