<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 850">
  <defs>
    <style>
      text { font-family: Arial, sans-serif; }
      .title { font-size: 20px; font-weight: bold; fill: #1a1a1a; }
      .subtitle { font-size: 11px; fill: #666; }
      .box-label { font-size: 11px; font-weight: bold; fill: #fff; }
      .box-detail { font-size: 9px; fill: #fff; opacity: 0.9; }
      .section-label { font-size: 12px; font-weight: bold; fill: #333; }
      .connector { fill: none; stroke: #888; stroke-width: 1.5; }
    </style>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="112%">
      <feDropShadow dx="2" dy="3" stdDeviation="3" flood-opacity="0.2"/>
    </filter>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#888"/>
    </marker>
  </defs>

  <rect width="1200" height="850" fill="#f8f9fa" rx="8"/>

  <!-- Title -->
  <text x="600" y="35" text-anchor="middle" class="title">First Solar Supply Chain Intelligence Agent — System Architecture</text>
  <text x="600" y="52" text-anchor="middle" class="subtitle">FS_INTELLIGENCE | 3 Schemas | 10 Agent Tools | Account: AWS161</text>

  <!-- ═══ USER LAYER ═══ -->
  <rect x="440" y="70" width="320" height="48" rx="8" fill="#1B6B93" filter="url(#shadow)"/>
  <text x="600" y="92" text-anchor="middle" class="box-label" style="font-size:13px;">Supply Chain Planners &amp; Operations Leaders</text>
  <text x="600" y="107" text-anchor="middle" class="box-detail">Natural Language → Snowflake Intelligence</text>

  <!-- Arrow: User → Agent (bottom-center of user to top-center of agent) -->
  <line x1="600" y1="118" x2="600" y2="138" class="connector" marker-end="url(#arrow)"/>

  <!-- ═══ AGENT LAYER ═══ -->
  <rect x="350" y="140" width="500" height="52" rx="8" fill="#29B5E8" filter="url(#shadow)"/>
  <text x="600" y="163" text-anchor="middle" class="box-label" style="font-size:14px;">FIRST_SOLAR_AGENT</text>
  <text x="600" y="180" text-anchor="middle" class="box-detail" style="font-size:10px;">10 Tools | YAML Spec | 15 Sample Questions | Budget: 60s / 32K tokens</text>

  <!-- Arrows: Agent → 3 tool columns (bottom of agent to top of section headers) -->
  <line x1="450" y1="192" x2="200" y2="225" class="connector" marker-end="url(#arrow)"/>
  <line x1="600" y1="192" x2="600" y2="225" class="connector" marker-end="url(#arrow)"/>
  <line x1="750" y1="192" x2="1000" y2="225" class="connector" marker-end="url(#arrow)"/>

  <!-- ═══ TOOL COLUMN 1: Cortex Analyst ═══ -->
  <text x="200" y="240" text-anchor="middle" class="section-label">Cortex Analyst (3)</text>

  <rect x="50" y="255" width="300" height="48" rx="6" fill="#1976D2" filter="url(#shadow)"/>
  <text x="200" y="276" text-anchor="middle" class="box-label">SupplyChainOps</text>
  <text x="200" y="292" text-anchor="middle" class="box-detail">Inventory, POs, Suppliers, Transfers, Recommendations</text>

  <rect x="50" y="313" width="300" height="48" rx="6" fill="#1976D2" filter="url(#shadow)"/>
