  <text x="1000" y="276" text-anchor="middle" class="box-label">StockoutRiskPredictor</text>
  <text x="1000" y="292" text-anchor="middle" class="box-detail">MODEL()!PREDICT() → Top 25 at-risk materials</text>

  <rect x="850" y="313" width="300" height="48" rx="6" fill="#E65100" filter="url(#shadow)"/>
  <text x="1000" y="334" text-anchor="middle" class="box-label">DemandForecast</text>
  <text x="1000" y="350" text-anchor="middle" class="box-detail">8-week forecast by plant x product with 90% CI</text>

