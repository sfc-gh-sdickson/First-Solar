  <text x="430" y="490" style="font-size:9px; fill:#333;">PLANTS (3)</text>
  <text x="430" y="503" style="font-size:9px; fill:#333;">MATERIALS (50)</text>
  <text x="430" y="516" style="font-size:9px; fill:#333;">SUPPLIERS (20)</text>
  <text x="430" y="529" style="font-size:9px; fill:#333;">PURCHASE_ORDERS (790)</text>
  <text x="430" y="542" style="font-size:9px; fill:#333;">INVENTORY_SNAPSHOT (2394)</text>
  <text x="430" y="555" style="font-size:9px; fill:#333;">MRP_DEMAND (3780)</text>
  <text x="430" y="568" style="font-size:9px; fill:#333;">MANUFACTURING_SCHEDULE (66)</text>
  <text x="430" y="581" style="font-size:9px; fill:#333;">ANOMALY_ALERTS (115)</text>
  <text x="430" y="594" style="font-size:9px; fill:#333;">SUPPLY_RECOMMENDATIONS (58)</text>
  <text x="430" y="607" style="font-size:9px; fill:#333;">INVENTORY_TRANSFERS (64)</text>
  <text x="430" y="620" style="font-size:9px; fill:#333;">+ 7 more tables</text>

  <!-- REFERENCE Schema -->
  <rect x="620" y="455" width="180" height="200" rx="5" fill="#E8F5E9" stroke="#4CAF50" stroke-width="1"/>
  <text x="710" y="472" text-anchor="middle" style="font-size:11px; font-weight:bold; fill:#2E7D32;">REFERENCE Schema (5)</text>
  <text x="630" y="490" style="font-size:9px; fill:#333;">MATERIAL_RISK_PROFILE (50)</text>
  <text x="630" y="503" style="font-size:9px; fill:#333;">TRADE_LANE_DIM (54)</text>
  <text x="630" y="516" style="font-size:9px; fill:#333;">INDUSTRY_BENCHMARK_DIM (38)</text>
  <text x="630" y="529" style="font-size:9px; fill:#333;">SUPPLIER_EVENT_LOG (20)</text>
  <text x="630" y="542" style="font-size:9px; fill:#333;">MATERIAL_LOT_TRACE (37)</text>

  <!-- ANALYTICS Schema -->
  <rect x="820" y="455" width="180" height="200" rx="5" fill="#FFF3E0" stroke="#FF9800" stroke-width="1"/>
  <text x="910" y="472" text-anchor="middle" style="font-size:11px; font-weight:bold; fill:#E65100;">ANALYTICS Schema</text>
  <text x="830" y="490" style="font-size:9px; fill:#333;">3 Semantic Views</text>
  <text x="830" y="503" style="font-size:9px; fill:#333;">3 Cortex Search Services</text>
  <text x="830" y="516" style="font-size:9px; fill:#333;">4 UDF Functions</text>
  <text x="830" y="529" style="font-size:9px; fill:#333;">7 Analytical Views</text>
  <text x="830" y="542" style="font-size:9px; fill:#333;">1 Agent (FIRST_SOLAR_AGENT)</text>
  <text x="830" y="562" style="font-size:9px; fill:#333;">ML Models:</text>
  <text x="830" y="575" style="font-size:9px; fill:#333;">  DEMAND_FORECAST_MODEL</text>
  <text x="830" y="588" style="font-size:9px; fill:#333;">  STOCKOUT_RISK_MODEL</text>

  <!-- Arrows from semantic views to data -->
  <line x1="200" y1="540" x2="420" y2="540" class="arrow"/>

  <!-- Data Source -->
  <rect x="420" y="680" width="380" height="45" rx="6" fill="#37474F"/>
  <text x="610" y="700" text-anchor="middle" class="box-label">Data Generation (generate_data.py)</text>
  <text x="610" y="716" text-anchor="middle" class="box-detail">Python → CSV → Stage → COPY INTO | seed=42 reproducible</text>

  <line x1="510" y1="655" x2="510" y2="680" class="arrow"/>
  <line x1="710" y1="655" x2="710" y2="680" class="arrow"/>

  <!-- ML Pipeline -->
  <rect x="820" y="680" width="180" height="45" rx="6" fill="#37474F"/>
  <text x="910" y="700" text-anchor="middle" class="box-label">ML Pipeline</text>
  <text x="910" y="716" text-anchor="middle" class="box-detail">GBR Demand + GBC Stockout → Registry</text>
  <line x1="910" y1="655" x2="910" y2="680" class="arrow"/>

  <!-- Legend -->
  <rect x="50" y="740" width="15" height="15" rx="2" fill="#2196F3"/>
  <text x="72" y="752" style="font-size:10px; fill:#333;">Cortex Analyst</text>
  <rect x="170" y="740" width="15" height="15" rx="2" fill="#4CAF50"/>
  <text x="192" y="752" style="font-size:10px; fill:#333;">Cortex Search</text>
  <rect x="290" y="740" width="15" height="15" rx="2" fill="#FF9800"/>
  <text x="312" y="752" style="font-size:10px; fill:#333;">UDF Functions</text>
  <rect x="410" y="740" width="15" height="15" rx="2" fill="#7B1FA2"/>
  <text x="432" y="752" style="font-size:10px; fill:#333;">Semantic Views</text>
  <rect x="540" y="740" width="15" height="15" rx="2" fill="#29B5E8"/>
  <text x="562" y="752" style="font-size:10px; fill:#333;">Agent</text>

  <!-- Footer -->
  <text x="600" y="785" text-anchor="middle" style="font-size:9px; fill:#999;">First Solar Supply Chain Intelligence Agent | Account: AWS161 | Database: FS_INTELLIGENCE | Warehouse: FIRST_SOLAR_WH</text>
</svg>
