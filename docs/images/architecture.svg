  <text x="200" y="350" text-anchor="middle" class="box-detail">Schedule, Forecasts, BOM, Customers, MRP Demand</text>

  <rect x="50" y="371" width="300" height="48" rx="6" fill="#1976D2" filter="url(#shadow)"/>
  <text x="200" y="392" text-anchor="middle" class="box-label">RiskIntelligence</text>
  <text x="200" y="408" text-anchor="middle" class="box-detail">Risk Profiles, Trade Lanes, Benchmarks, Anomalies</text>

