  <text x="200" y="410" text-anchor="middle" class="section-label">Semantic Views</text>
  <line x1="200" y1="380" x2="200" y2="420" class="arrow"/>
  <rect x="50" y="420" width="300" height="35" rx="4" fill="#7B1FA2"/>
  <text x="200" y="442" text-anchor="middle" class="box-label">SUPPLY_CHAIN_OPERATIONS_SV</text>
  <rect x="50" y="462" width="300" height="35" rx="4" fill="#7B1FA2"/>
  <text x="200" y="484" text-anchor="middle" class="box-label">MANUFACTURING_DEMAND_SV</text>
  <rect x="50" y="504" width="300" height="35" rx="4" fill="#7B1FA2"/>
  <text x="200" y="526" text-anchor="middle" class="box-label">RISK_INTELLIGENCE_SV</text>

